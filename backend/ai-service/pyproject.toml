[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "packman-ai-service"
version = "0.1.0"
description = "PackMan AI service for generating device descriptions and traits using OpenAI"
readme = "README.md"
requires-python = "==3.13.*"
license = { text = "Commercial" }
authors = [
  { name = "Nikolai Stepanov", email = "nickstepargentina@gmail.com" }
]
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.32.1",
  "openai>=1.99,<2",
  "sqlalchemy==2.0.36",
  "psycopg2-binary==2.9.10",
  "alembic==1.14.0",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "langchain>=0.3.0",
  "langchain-core>=0.3.0",
  "langchain-openai>=0.2.0",
  "langchain-community>=0.3.0",
  "langchain-qdrant>=0.2.1",
  "qdrant-client>=1.17.0",
  "dirtyjson>=1.0.8",
]

[project.optional-dependencies]
dev = [
  "pytest",
]
eval = [
  "pytest",
  "deepeval>=4.2,<5",
]

[project.scripts]
packman-ai-service = "app.main:main"
packman-clear-vertical-db = "app.scripts.clear_vertical_db:main"
packman-run-qdrant = "app.scripts.run_qdrant:main"
packman-reindex-devices = "app.scripts.reindex_devices:main"

[tool.setuptools]
packages = ["app", "app.scripts"]

